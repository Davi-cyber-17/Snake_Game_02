<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <section class="topbar">
            <div>
                <h1>Snake Game</h1>
                <p>Coma as frutas e fique cada vez maior!</p>
            </div>
            <div class="stats">
                <div class="stat">
                    <span>Pontos</span>
                    <strong id="score">0</strong>
                </div>
                <div class="stat">
                    <span>Recorde</span>
                    <strong id="highScore">0</strong>
                </div>
                <div class="stat">
                    <span>Nível</span>
                    <strong id="level">1</strong>
                </div>
            </div>
        </section>

        <section class="game-card">
            <div class="toolbar">
                <div class="difficulty">
                    <button class="diffButton" data-difficulty="easy">Fácil</button>
                    <button class="diffButton active" data-difficulty="normal">Normal</button>
                    <button class="diffButton" data-difficulty="hard">Difícil</button>
                </div>
                <button id="muteButton" class="iconButton" title="Ativar/desativar som">🔊</button>
            </div>

            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="460" height="460"></canvas>

                <div id="countdown" class="countdown hidden">
                    <span id="countdownNumber">3</span>
                </div>

                <div id="message" class="message hidden">
                    <div class="message-box">
                        <h2 id="messageTitle">Fim de jogo!</h2>
                        <p id="messageText">Sua pontuação foi 0.</p>
                        <button id="restartButton">Jogar novamente</button>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="pauseButton">⏸ Pausar</button>
                <button id="restartTopButton">↻ Reiniciar</button>
            </div>

            <div class="instructions">
                <span>⌨️ <b>WASD</b> ou <b>Setas</b> para mover</span>
                <span>⏸ <b>Espaço</b> para pausar</span>
                <span>🍎 Frutas normais valem 1 ponto</span>
                <span>⭐ Fruta dourada vale 3 e some rápido</span>
            </div>

            <div class="mobile-controls">
                <button data-direction="up">▲</button>
                <div>
                    <button data-direction="left">◀</button>
                    <button data-direction="down">▼</button>
                    <button data-direction="right">▶</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
